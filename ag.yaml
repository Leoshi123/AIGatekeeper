# AG-Wrapper Configuration
# Crea este archivo en la raiz de tu proyecto para personalizar el wrapper.
# Los valores por defecto se usan si no existe ag.yaml.
# Extensions must stay in sync with src/languages.py (single source of truth).
version: "1.0"

wrapper:
  sanitize_input: true
  sanitize_output: true
  prune_context: false
  block_critical: true
  # agent_command: "claude"

detector:
  severity_threshold: "high"  # low | medium | high | critical
  # custom_patterns:
  #   - pattern: "my_secret_\\w+"
  #     severity: "critical"
  #     description: "Custom secret pattern"
  #     language: "python"

sanitizer:
  remove_comments: true
  remove_paths: true
  preserve_shebang: true
  preserve_copyright: false

watch:
  extensions:
    - .py
    - .js
    - .ts
    - .tsx
    - .jsx
    - .go
    - .rs
    - .java
    - .c
    - .cpp
    - .cc
    - .cxx
    - .h
    - .hpp
    - .php
    # v3.0.0 languages
    - .rb
    - .kt
    - .kts
    - .cs
    - .swift
    - .scala
  exclude_dirs:
    - .git
    - node_modules
    - __pycache__
    - .venv
    - venv
    - build
    - dist
  block_on_scan: false
  quiet: false
